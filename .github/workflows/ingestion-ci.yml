name: Ingestion checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_PASSWORD: ephemeral-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci@127.0.0.1:5432/healthcare_test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.19
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests/unit tests/integration scripts/benchmark_ingestion.py scripts/benchmark_quality.py scripts/benchmark_matching.py scripts/evaluate_matching.py scripts/bootstrap_workflow.py scripts/demo_workflow.py
      - run: uv run --locked python -m unittest discover -s tests -t . -v
      - run: git diff --check HEAD^ HEAD

  fresh-workflow-demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Start fresh fixture-only workflow and verify replay
        shell: bash
        run: |
          umask 077
          for name in POSTGRES_PASSWORD INGEST_PASSWORD WORKFLOW_EXEC_PASSWORD WORKFLOW_REPORT_PASSWORD WORKFLOW_TOKEN; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 24)" >> .env
          done
          docker compose --profile workflow up -d --build --wait
          set -a
          source .env
          set +a
          python scripts/demo_workflow.py
          docker compose --profile workflow restart api
          for i in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health/ready; then
              python scripts/demo_workflow.py
              exit 0
            fi
            sleep 1
          done
          exit 1
