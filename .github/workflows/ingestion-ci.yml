name: Ingestion checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_PASSWORD: ephemeral-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci@127.0.0.1:5432/healthcare_test
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests/unit tests/integration scripts/benchmark_ingestion.py
      - run: uv run --locked python -m unittest discover -s tests -t . -v
      - run: git diff --check HEAD^ HEAD
