services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ingestion_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  ingestion_db:
